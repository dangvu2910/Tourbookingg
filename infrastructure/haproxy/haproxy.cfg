global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    timeout connect 2s
    timeout client 30s
    timeout server 20s
    timeout check 1s
    retries 0
    default-server inter 1s fall 2 rise 1 resolvers docker resolve-prefer ipv4 init-addr none

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 2s
    hold nx 1s
    hold other 1s
    hold refused 1s
    hold timeout 1s
    hold obsolete 1s

frontend public
    bind :8000
    default_backend kong_nodes

backend kong_nodes
    balance roundrobin
    option httpchk GET /status/ready
    http-check expect status 200
    http-response set-header X-Edge-Upstream %[srv_name]
    server-template kong 2 kong:8000 check port 8100

# Internal listeners are private to the Compose network. They also balance HTTP
# projections, identity checks and idempotent reservation commands across replicas.
listen identity_nodes
    bind :8101
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    server-template identity 2 identity:8080 check

listen catalog_nodes
    bind :8102
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    server-template catalog 2 catalog:8080 check

listen booking_nodes
    bind :8103
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    server-template booking 2 booking:8080 check

listen customer_nodes
    bind :8104
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    server-template customer 2 customer:8080 check

listen notification_nodes
    bind :8105
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    server-template notification 2 notification:8080 check
