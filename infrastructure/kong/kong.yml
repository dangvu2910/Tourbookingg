_format_version: "3.0"
_transform: true
upstreams:
  - name: gateway-pool
    algorithm: round-robin
    healthchecks: &app-health
      active:
        type: http
        http_path: /health/ready
        timeout: 1
        healthy: { interval: 2, successes: 1, http_statuses: [200] }
        unhealthy: { interval: 1, http_failures: 1, tcp_failures: 1, timeouts: 1, http_statuses: [500, 502, 503, 504] }
      passive:
        unhealthy: { http_failures: 1, tcp_failures: 1, timeouts: 1, http_statuses: [502, 503, 504] }
    targets: [{ target: "gateway:8080", weight: 100 }]
  - name: identity-pool
    algorithm: round-robin
    healthchecks: *app-health
    targets: [{ target: "identity:8080", weight: 100 }]
  - name: catalog-pool
    algorithm: round-robin
    healthchecks: *app-health
    targets: [{ target: "catalog:8080", weight: 100 }]
  - name: booking-pool
    algorithm: round-robin
    healthchecks: *app-health
    targets: [{ target: "booking:8080", weight: 100 }]
  - name: customer-pool
    algorithm: round-robin
    healthchecks: *app-health
    targets: [{ target: "customer:8080", weight: 100 }]
  - name: notification-pool
    algorithm: round-robin
    healthchecks: *app-health
    targets: [{ target: "notification:8080", weight: 100 }]
services:
  - name: web
    url: http://gateway-pool
    connect_timeout: 2000
    read_timeout: 15000
    write_timeout: 15000
    retries: 0
    routes:
      - name: mvc-and-assets
        paths: ["/"]
        strip_path: false
        preserve_host: true
  - name: identity-v1
    url: http://identity-pool
    connect_timeout: 2000
    read_timeout: 15000
    write_timeout: 15000
    retries: 0
    routes:
      - name: auth-v1
        paths: ["/api/v1/auth"]
        strip_path: false
        preserve_host: true
  - name: catalog-v1
    url: http://catalog-pool
    connect_timeout: 2000
    read_timeout: 15000
    write_timeout: 15000
    retries: 0
    routes:
      - name: catalog-v1
        paths: ["/api/v1/catalog"]
        strip_path: false
        preserve_host: true
  - name: booking-v1
    url: http://booking-pool
    connect_timeout: 2000
    read_timeout: 15000
    write_timeout: 15000
    retries: 0
    routes:
      - name: bookings-v1
        paths: ["/api/v1/bookings"]
        strip_path: false
        preserve_host: true
  - name: notification-v1
    url: http://notification-pool
    connect_timeout: 2000
    read_timeout: 15000
    write_timeout: 15000
    retries: 0
    routes:
      - name: notifications-v1
        paths: ["/api/v1/notifications"]
        strip_path: false
        preserve_host: true
  - name: chat-v1
    url: http://customer-pool
    connect_timeout: 2000
    read_timeout: 15000
    write_timeout: 15000
    retries: 0
    routes:
      - name: chat-v1
        paths: ["/api/v1/chat"]
        strip_path: false
        preserve_host: true
  - name: private-block
    url: http://gateway-pool
    routes:
      - name: private-block
        paths: ["/internal", "/service-info"]
        strip_path: false
    plugins:
      - name: request-termination
        config:
          status_code: 404
          message: Not found
plugins:
  - name: request-transformer
    config:
      remove:
        headers: ["X-Service-Key"]
