# Optional local administration only. Keep the base stack private by default.
# Application services publish no ports: the website is reachable only through Kong (http://localhost:8080).
# One loopback port per tool: SQL Server for SSMS (127.0.0.1,14333), MongoDB for Compass, RabbitMQ management UI.
services:
  sqlserver:
    ports: ["127.0.0.1:14333:1433"]
  mongodb:
    ports: ["127.0.0.1:27018:27017"]
  rabbitmq:
    ports: ["[::1]:15672:15672"]
