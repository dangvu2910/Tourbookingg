# SQLEXPRESS runs on Windows; Docker applications connect through host.docker.internal.
services:
  sqlserver:
    profiles: ["docker-sql"]
  sql-provision:
    profiles: ["docker-sql"]
  identity-init:
    profiles: ["docker-sql"]
  catalog-init:
    profiles: ["docker-sql"]
  booking-init:
    profiles: ["docker-sql"]
  customer-init:
    profiles: ["docker-sql"]
  identity:
    depends_on: !reset {}
    environment:
      Database__Schema: identity
      ConnectionStrings__DefaultConnection: Server=host.docker.internal,${SQL_EXPRESS_PORT:-14335};Database=TourBookingDB;User Id=tourbooking_identity_app;Password=${IDENTITY_SQL_PASSWORD};TrustServerCertificate=True
  catalog:
    depends_on: !reset {}
    environment:
      Database__Schema: catalog
      ConnectionStrings__DefaultConnection: Server=host.docker.internal,${SQL_EXPRESS_PORT:-14335};Database=TourBookingDB;User Id=tourbooking_catalog_app;Password=${CATALOG_SQL_PASSWORD};TrustServerCertificate=True
  booking:
    depends_on: !reset {}
    environment:
      Database__Schema: booking
      ConnectionStrings__DefaultConnection: Server=host.docker.internal,${SQL_EXPRESS_PORT:-14335};Database=TourBookingDB;User Id=tourbooking_booking_app;Password=${BOOKING_SQL_PASSWORD};TrustServerCertificate=True
  customer:
    depends_on: !override
      mongodb: { condition: service_healthy }
    environment:
      Database__Schema: customer
      ConnectionStrings__DefaultConnection: Server=host.docker.internal,${SQL_EXPRESS_PORT:-14335};Database=TourBookingDB;User Id=tourbooking_customer_app;Password=${CUSTOMER_SQL_PASSWORD};TrustServerCertificate=True
