name: ${HYBRID_PROJECT_NAME:-tourbooking-hybrid}

x-env: &env
  ASPNETCORE_ENVIRONMENT: Production
  TZ: Asia/Ho_Chi_Minh
  Database__Provider: SqlServer
  Database__Initialize: "false"
  Reservations__Enabled: "true"
  Services__InternalKey: ${INTERNAL_SERVICE_KEY:?Run Initialize-Environment.ps1}
  Jwt__SigningKey: ${API_JWT_SIGNING_KEY:?Run Initialize-Environment.ps1}
  RabbitMQ__Enabled: "true"
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Username: tourbooking
  RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Required}
  DataProtection__KeysPath: /keys
  Https__Redirect: "false"
  Service__TrustGateway: "true"
  Services__identity: http://identity:8080
  Services__catalog: http://catalog:8080
  Services__booking: http://booking:8080
  Services__payment: http://booking:8080
  Services__review: http://identity:8080
  Services__support: http://customer:8080
  Services__reporting: http://catalog:8080
  Services__notification: http://notification:8080
  Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
  Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
  # One JSON object per log line (with scopes such as CorrelationId) so Loki/Grafana can parse and filter logs.
  Logging__Console__FormatterName: json
  Logging__Console__FormatterOptions__IncludeScopes: "true"
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-ddTHH:mm:ss.fffK"
  Logging__Console__FormatterOptions__UseUtcTimestamp: "true"

x-app: &app
  restart: unless-stopped
  volumes: ["hybrid-keys:/keys"]
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q \"200\"'"]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 30s

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU22-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Required}
    volumes: ["hybrid-sql:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  sql-provision:
    image: mcr.microsoft.com/mssql/server:2022-CU22-ubuntu-22.04
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command: ["-S", "sqlserver", "-U", "sa", "-C", "-b", "-i", "/provision.sql"]
    environment:
      SQLCMDPASSWORD: ${SQL_PASSWORD}
      IDENTITY_SQL_PASSWORD: ${IDENTITY_SQL_PASSWORD:?Required}
      CATALOG_SQL_PASSWORD: ${CATALOG_SQL_PASSWORD:?Required}
      BOOKING_SQL_PASSWORD: ${BOOKING_SQL_PASSWORD:?Required}
      CUSTOMER_SQL_PASSWORD: ${CUSTOMER_SQL_PASSWORD:?Required}
    volumes: ["./infrastructure/sql/provision.sql:/provision.sql:ro"]
    depends_on:
      sqlserver: { condition: service_healthy }

  mongodb:
    image: mongo:8.0.17
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Required}
      MONGO_CHAT_PASSWORD: ${MONGO_CHAT_PASSWORD:?Required}
      MONGO_NOTIFICATION_PASSWORD: ${MONGO_NOTIFICATION_PASSWORD:?Required}
    volumes:
      - hybrid-mongo:/data/db
      - ./infrastructure/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: tourbooking
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: ["hybrid-rabbit:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  identity-init:
    image: tourbooking-hybrid-identity
    build: { context: ., dockerfile: services/Identity/Dockerfile, args: { SERVICE: Identity } }
    environment:
      <<: *env
      Database__Initialize: "true"
      Database__InitializeOnly: "true"
      Database__Schema: identity
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=IdentityDB;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
      AdminUser__Email: ${ADMIN_EMAIL}
      AdminUser__Password: ${HYBRID_ADMIN_PASSWORD:?Run Initialize-Environment.ps1}
    volumes: ["hybrid-keys:/keys"]
    depends_on:
      sql-provision: { condition: service_completed_successfully }

  catalog-init:
    image: tourbooking-hybrid-catalog
    build: { context: ., dockerfile: services/Catalog/Dockerfile, args: { SERVICE: Catalog } }
    environment:
      <<: *env
      Database__Initialize: "true"
      Database__InitializeOnly: "true"
      Database__Schema: catalog
      Database__SeedDemo: ${HYBRID_SEED_DEMO:-true}
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=CatalogDB;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
    volumes: ["hybrid-keys:/keys"]
    depends_on:
      sql-provision: { condition: service_completed_successfully }

  booking-init:
    image: tourbooking-hybrid-booking
    build: { context: ., dockerfile: services/Booking/Dockerfile, args: { SERVICE: BookingPlatform, SERVICE_DIR: Booking } }
    environment:
      <<: *env
      Database__Initialize: "true"
      Database__InitializeOnly: "true"
      Database__Schema: booking
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=BookingDB;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
    volumes: ["hybrid-keys:/keys"]
    depends_on:
      sql-provision: { condition: service_completed_successfully }

  customer-init:
    image: tourbooking-hybrid-customer
    build: { context: ., dockerfile: services/Customer/Dockerfile, args: { SERVICE: CustomerExperience, SERVICE_DIR: Customer } }
    environment:
      <<: *env
      Database__Initialize: "true"
      Database__InitializeOnly: "true"
      Database__Schema: customer
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=CustomerDB;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
    volumes: ["hybrid-keys:/keys"]
    depends_on:
      sql-provision: { condition: service_completed_successfully }

  identity:
    <<: *app
    image: tourbooking-hybrid-identity
    environment:
      <<: *env
      Database__Schema: identity
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=IdentityDB;User Id=identity_app;Password=${IDENTITY_SQL_PASSWORD};TrustServerCertificate=True
    depends_on:
      identity-init: { condition: service_completed_successfully }

  catalog:
    <<: *app
    image: tourbooking-hybrid-catalog
    environment:
      <<: *env
      Database__Schema: catalog
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=CatalogDB;User Id=catalog_app;Password=${CATALOG_SQL_PASSWORD};TrustServerCertificate=True
    volumes: ["hybrid-keys:/keys", "hybrid-images:/app/wwwroot/images"]
    depends_on:
      catalog-init: { condition: service_completed_successfully }

  booking:
    <<: *app
    image: tourbooking-hybrid-booking
    environment:
      <<: *env
      Database__Schema: booking
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=BookingDB;User Id=booking_app;Password=${BOOKING_SQL_PASSWORD};TrustServerCertificate=True
    volumes: ["hybrid-keys:/keys", "hybrid-images:/app/wwwroot/images"]
    depends_on:
      booking-init: { condition: service_completed_successfully }

  customer:
    <<: *app
    image: tourbooking-hybrid-customer
    environment:
      <<: *env
      Database__Schema: customer
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=CustomerDB;User Id=customer_app;Password=${CUSTOMER_SQL_PASSWORD};TrustServerCertificate=True
      Chat__Provider: MongoDB
      Chat__ConnectionString: mongodb://chat_app:${MONGO_CHAT_PASSWORD}@mongodb:27017/ChatDB
      Chat__Database: ChatDB
    volumes: ["hybrid-keys:/keys", "hybrid-images:/app/wwwroot/images"]
    depends_on:
      customer-init: { condition: service_completed_successfully }
      mongodb: { condition: service_healthy }

  notification:
    <<: *app
    image: tourbooking-hybrid-notification
    build: { context: ., dockerfile: services/Notification/Dockerfile, args: { SERVICE: Notification } }
    environment:
      Database__Provider: MongoDB
      MongoDB__ConnectionString: mongodb://notification_app:${MONGO_NOTIFICATION_PASSWORD}@mongodb:27017/NotificationDB
      MongoDB__Database: NotificationDB
      Jwt__SigningKey: ${API_JWT_SIGNING_KEY:?Run Initialize-Environment.ps1}
      Services__identity: http://identity:8080
      Services__InternalKey: ${INTERNAL_SERVICE_KEY:?Required}
      DataProtection__KeysPath: /keys
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: tourbooking
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Logging__Console__FormatterName: json
      Logging__Console__FormatterOptions__IncludeScopes: "true"
      Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-ddTHH:mm:ss.fffK"
      Logging__Console__FormatterOptions__UseUtcTimestamp: "true"
    depends_on:
      mongodb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  web-router:
    <<: *app
    image: tourbooking-hybrid-web-router
    build: { context: ., dockerfile: services/Gateway/Dockerfile, args: { SERVICE: Gateway } }
    environment:
      <<: *env
    volumes: ["hybrid-images:/app/wwwroot/images"]

  gateway:
    image: kong:3.9.1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_DNS_VALID_TTL: "5"
      KONG_DNS_STALE_TTL: "5"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes: ["./infrastructure/kong/kong.hybrid.yml:/etc/kong/kong.yml:ro"]
    # Single public entry; no extra edge/LB container.
    # Single loopback binding on ::1: Windows resolves "localhost" to ::1 first (an IPv4-only 127.0.0.1 binding
    # made every new connection wait ~200 ms). Open http://localhost:8080; 127.0.0.1 is not bound.
    ports: ["[::1]:${HTTP_PORT:-8080}:8000"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      web-router: { condition: service_healthy }
      identity: { condition: service_healthy }
      catalog: { condition: service_healthy }
      booking: { condition: service_healthy }
      customer: { condition: service_healthy }
      notification: { condition: service_healthy }
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build: { context: ., target: source }
    command: ["dotnet", "test", "tests/Tourbooking.Tests/Tourbooking.Tests.csproj", "--logger", "console;verbosity=normal"]
    environment:
      TOURBOOKING_URL: http://gateway:8000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: tourbooking
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      TEST_ADMIN_EMAIL: ${ADMIN_EMAIL}
      TEST_ADMIN_PASSWORD: ${HYBRID_ADMIN_PASSWORD}
      TEST_CHAT_MONGO: mongodb://chat_app:${MONGO_CHAT_PASSWORD}@mongodb:27017/ChatDB
      TEST_NOTIFICATION_MONGO: mongodb://notification_app:${MONGO_NOTIFICATION_PASSWORD}@mongodb:27017/NotificationDB
      TEST_SQL_BOOKING: Server=sqlserver;Database=BookingDB;User Id=booking_app;Password=${BOOKING_SQL_PASSWORD};TrustServerCertificate=True
      TEST_SQL_CATALOG: Server=sqlserver;Database=CatalogDB;User Id=catalog_app;Password=${CATALOG_SQL_PASSWORD};TrustServerCertificate=True
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  hybrid-sql:
  hybrid-mongo:
  hybrid-rabbit:
  hybrid-keys:
  hybrid-images:
