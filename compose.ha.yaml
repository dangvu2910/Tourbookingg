# SQL Server/MongoDB only. Do not apply to the legacy SQLite stack.
services:
  identity:
    deploy: { replicas: 2 }
    environment: &balanced-services
      Services__identity: http://edge:8101
      Services__catalog: http://edge:8102
      Services__booking: http://edge:8103
      Services__payment: http://edge:8103
      Services__reporting: http://edge:8103
      Services__review: http://edge:8104
      Services__support: http://edge:8104
      Services__notification: http://edge:8105
  catalog:
    deploy: { replicas: 2 }
    environment: *balanced-services
  booking:
    deploy: { replicas: 2 }
    environment: *balanced-services
  customer:
    deploy: { replicas: 2 }
    environment: *balanced-services
  notification:
    deploy: { replicas: 2 }
    environment:
      Services__identity: http://edge:8101
  gateway:
    deploy: { replicas: 2 }
    environment: *balanced-services
  kong:
    deploy: { replicas: 2 }
    ports: !reset []
    environment:
      KONG_NGINX_WORKER_PROCESSES: "1"
  edge:
    image: haproxy:3.0.12-alpine
    restart: unless-stopped
    volumes: ["./infrastructure/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    ports: ["127.0.0.1:${HA_HTTP_PORT:-8080}:8000"]
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 3s
      retries: 3
